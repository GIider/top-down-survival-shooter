<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-version" content="__APP_VERSION__" />
  <title>Skill Showcase - Top-Down Survival Shooter</title>
  <link rel="stylesheet" href="./static-pages.css" />
</head>
<body>
  <main class="page">
    __STATIC_SITE_HEADER__

    <section class="stage" aria-label="Skill showcase stage">
      <div class="stage-head">
        <h2 class="stage-title">
          <span id="skill-showcase-title">Skill</span>
          <span id="skill-showcase-badge" class="chip"></span>
        </h2>
        <label class="picker-wrap" for="skill-picker">
          Skill
          <select id="skill-picker" aria-label="Select skill"></select>
        </label>
      </div>
      <canvas id="skill-showcase-canvas" width="820" height="420"></canvas>
      <div class="stage-body">
        <div id="skill-showcase-description"></div>
        <div id="skill-showcase-legend" class="legend"></div>
        <div id="skill-showcase-stats" class="stats" aria-live="polite"></div>
      </div>
    </section>

    __STATIC_SITE_FOOTER__
  </main>

<!-- __INLINE_SCRIPT__ -->
</body>
</html>
